<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>100%</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<style>
/* App de una sola pantalla, con aire de juego de mesa: la altura sigue al teclado del móvil para que lo importante quede siempre a la vista. Letra pensada para leerse sin gafas. */
:root{
  color-scheme:light;
  --bg:#f3f4f6; --fg:#1f2933; --muted:#566270; --surface:#ffffff; --ink:#1f2933; --ink-muted:#566270; --primary:#1565d8; --on-primary:#ffffff;
  --soft:#e3e6ea; --soft-ink:#1f2933; --word:#d9e7fb; --solved:#1565d8; --hit:#1565d8; --hit-ink:#ffffff; --bad:#c62f3b; --on-bad:#ffffff; --shade:rgba(31,41,51,.5);
  --display:"Nunito","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:18px;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
input{-webkit-user-select:text;user-select:text}
body{margin:0;background:var(--bg);color:var(--fg);font:600 1rem/1.3 var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
h1,h2,h3,p{margin:0}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:.6rem;padding-block:.6rem;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:.4rem;flex:none;min-height:2.6rem}
.back{font-weight:800;padding:.5rem .7rem .5rem 0;flex:none}
.where{flex:1;min-width:0;color:var(--muted);font-weight:800;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where small{display:block;font-size:.85rem;color:var(--fg)}
.coins{font-weight:800;font-variant-numeric:tabular-nums;background:var(--soft);color:var(--soft-ink);border-radius:99px;padding:.3rem .7rem;white-space:nowrap;flex:none}
.btn{font-weight:800;padding:.65rem .9rem;border-radius:12px;background:var(--primary);color:var(--on-primary);min-height:2.7rem}
.btn.soft{background:var(--soft);color:var(--soft-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Portada */
.logo{font:900 clamp(3.4rem,18vw,5rem)/1 var(--display);color:var(--primary);flex:none}
.tag{color:var(--muted);flex:none}
.reto{flex:none;display:flex;align-items:center;gap:.6rem;background:var(--primary);color:var(--on-primary);border-radius:18px;padding:.6rem .9rem;text-align:left}
.reto div{flex:1;min-width:0}
.reto b{display:block;font:900 1.25rem/1.1 var(--display)}
.reto span{font-size:.9rem}
.reto strong{font:900 1.3rem/1 var(--display);flex:none;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:.9rem;font-variant-numeric:tabular-nums;background:var(--word);color:var(--ink);opacity:.75}
.cal span.head{background:none;font-weight:800;aspect-ratio:auto;opacity:1}
.cal span.none{background:none}
.cal span.done{background:var(--hit);color:var(--hit-ink);opacity:1;font-weight:800}
.cal span.saved{background:var(--soft);color:var(--soft-ink);opacity:1}
.cal span.today{outline:2px solid var(--ink);opacity:1}
.calnav{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
a.link{display:flex;align-items:center;justify-content:center;text-decoration:none}
.over textarea{width:100%;min-height:5rem;border:2px solid var(--primary);border-radius:12px;padding:.5rem;background:var(--surface);color:var(--ink);font:600 16px var(--body);-webkit-user-select:text;user-select:text}
.modes{flex:1;min-height:0;display:flex;flex-direction:column;gap:.6rem}
.mode{flex:1;min-height:0;background:var(--surface);color:var(--ink);border-radius:18px;padding:.9rem;display:flex;flex-direction:column;justify-content:center;gap:.45rem}
.mode h2{font:900 1.6rem/1.1 var(--display)}
.mode .row{display:flex;gap:.5rem}
.mode .row .btn{flex:1}
.mode small{color:var(--ink-muted);font-size:.9rem}
.bar{height:.7rem;background:var(--soft);border-radius:99px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .4s}
.note{font-size:.8rem;color:var(--muted);flex:none}

/* Elegir nivel */
.title{font:900 1.6rem/1.1 var(--display)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;flex:none}
.seg button{flex:1;padding:.5rem;border-radius:10px;font-weight:800;color:var(--soft-ink)}
.seg button.on{background:var(--surface);color:var(--ink)}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.tier{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1rem}
.tier h2{font:900 1.3rem/1.1 var(--display);display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap}
.tier h2 small{font:600 .85rem var(--body);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(3rem,1fr));gap:.4rem}
.lv{aspect-ratio:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums;background:var(--surface);color:var(--ink)}
.lv:disabled{background:var(--soft);color:var(--soft-ink);opacity:.45;cursor:not-allowed}
.lv small{font-size:.6rem;height:.75rem;line-height:.75rem;letter-spacing:.5px}
.lv.done{background:var(--hit);color:var(--hit-ink)}

/* Encuesta */
.meter{display:flex;align-items:center;gap:.6rem;flex:none}
.meter .bar{flex:1;height:1rem}
.meter .btn{flex:none;min-height:2.2rem;padding:.2rem .6rem;font-size:.9rem}
.meter strong{font:900 1.5rem/1 var(--display);font-variant-numeric:tabular-nums;min-width:3.2rem;text-align:right;color:var(--primary)}
.q{flex:none;display:flex;align-items:center;gap:.6rem}
.q h1{font:900 clamp(1.25rem,5.6vw,1.6rem)/1.15 var(--display);flex:1;min-width:0}
.q .pic{font-size:2.3rem;line-height:1;flex:none}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:.3rem;align-content:start}
.slot{display:flex;justify-content:space-between;align-items:center;gap:.3rem;min-height:2.4rem;padding:.3rem .55rem;border-radius:10px;background:var(--surface);color:var(--ink-muted);min-width:0;font-size:.95rem}
.slot .t{min-width:0;overflow-wrap:anywhere}
.slot .p{font-weight:800;flex:none;font-size:.85rem}
.slot.hit{background:var(--hit);color:var(--hit-ink);font-weight:800;animation:pop .3s}
@keyframes pop{0%{transform:scale(.9)}100%{transform:none}}
.entry{display:flex;gap:.4rem;flex:none}
.entry input{flex:1;min-width:0;background:var(--surface);color:var(--ink);border:2px solid var(--primary);border-radius:12px;padding:.4rem .7rem;font:800 max(16px,1.1rem) var(--body);min-height:2.8rem}
.entry input::placeholder{color:var(--ink-muted);font-weight:600}
.entry input.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Crucigrama */
.boardbox{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.board{touch-action:manipulation;-webkit-touch-callout:none}
.ghost{position:absolute;top:0;left:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px}
.board{display:grid;gap:2px}
.cell{position:relative;width:var(--c);height:var(--c)}
.cell.on{background:var(--surface);color:var(--ink);border-radius:4px;cursor:pointer;box-shadow:0 0 0 1px var(--soft)}
.cell.on.word{background:var(--word)}
.cell.on.solved{color:var(--solved)}
.cell.on.cur{background:var(--hit);color:var(--hit-ink)}
.cell.on.wrong{background:var(--bad);color:var(--on-bad)}
.cell .n{position:absolute;top:1px;left:2px;font-size:max(8px,calc(var(--c)*.26));line-height:1}
.cell .l{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 calc(var(--c)*.66)/1 var(--display)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:.35rem;flex:none}
.tools .btn{padding:.3rem;font-size:.9rem;min-height:2.4rem}
.clue{flex:none;display:flex;align-items:center;gap:.35rem;background:var(--surface);color:var(--ink);border-radius:12px;padding:.3rem}
.clue button{flex:none;width:2.4rem;height:3rem;border-radius:9px;background:var(--soft);color:var(--soft-ink);font-weight:900;font-size:1.3rem}
.clue span{flex:1;min-width:0;font-size:1.02rem;line-height:1.2;min-height:2.45rem;display:flex;align-items:center}

/* Ventanas */
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 3.2rem);left:50%;transform:translateX(-50%);z-index:15;background:var(--ink);color:var(--surface);padding:.45rem .9rem;border-radius:99px;font-weight:800;width:max-content;max-width:calc(100% - 28px);text-align:center;pointer-events:none}
.toast[hidden]{display:none}
.over{position:fixed;inset:0;z-index:20;background:var(--shade);display:flex;align-items:flex-end;justify-content:center}
.over>div{background:var(--surface);color:var(--ink);border-radius:20px 20px 0 0;padding:1.1rem max(16px,env(safe-area-inset-right,0px)) calc(1.1rem + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));width:min(520px,100%);display:flex;flex-direction:column;gap:.7rem;max-height:96%;overflow:auto}
.over h2{font:900 1.9rem/1.1 var(--display)}
.over h3{font:900 1.15rem var(--display)}
.over .note{color:var(--ink-muted)}
.over .st{font-size:2rem;letter-spacing:3px;line-height:1;color:var(--primary)}
.over .row{display:flex;gap:.5rem}
.over .row .btn{flex:1}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
.swatches button{padding:.5rem .2rem;border-radius:12px;font-size:.9rem;font-weight:800;color:var(--ink);background:var(--soft);display:flex;flex-direction:column;align-items:center;gap:.3rem}
.swatches button.on{outline:3px solid var(--ink)}
.swatches i{width:2rem;height:2rem;border-radius:50%;display:block}
.cluelist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.15rem}
.cluelist button{display:flex;gap:.5rem;text-align:left;width:100%;padding:.45rem .5rem;border-radius:9px}
.cluelist button b{flex:none;min-width:1.5rem}
.cluelist button.sel{background:var(--word)}
.cluelist button.ok{color:var(--ink-muted);text-decoration:line-through}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Aire de juego de mesa: fichas con borde oscuro y sombra dura que se hunden al pulsar, y amarillo de apoyo. */
:root{--sun:#ffd23f;--sun-ink:#332400;--edge:2px solid var(--ink);--pop:0 3px 0 var(--ink)}
.logo{align-self:flex-start;background:var(--primary);color:var(--on-primary);padding:.15rem .8rem;border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);transform:rotate(-2deg);font-size:clamp(3rem,15vw,4.2rem);margin:.1rem 0 .3rem .2rem}
.reto{background:var(--sun);color:var(--sun-ink);border:var(--edge);box-shadow:var(--pop)}
.reto strong{background:var(--surface);color:var(--ink);border:var(--edge);border-radius:99px;padding:.2rem .6rem;font-size:1.1rem}
.mode{border:var(--edge);box-shadow:var(--pop)}
.mode h2 span{margin-right:.35rem}
.btn{border:var(--edge);box-shadow:var(--pop);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.btn.soft{background:var(--surface);color:var(--ink)}
.coins{background:var(--sun);color:var(--sun-ink);border:var(--edge)}
.bar{border:var(--edge);height:.95rem;background:var(--surface)}
.bar i{border-radius:0;background:repeating-linear-gradient(135deg,var(--primary) 0 9px,color-mix(in srgb,var(--primary) 78%,#fff) 9px 18px)}
.meter .bar{height:1.2rem}
.tier h2{background:var(--ink);color:var(--surface);align-self:flex-start;padding:.2rem .7rem;border-radius:9px;transform:rotate(-1deg)}
.tier h2 small{color:var(--surface);opacity:.85}
.lv{border:var(--edge);box-shadow:var(--pop)}
.lv.done small{color:var(--sun)}
.lv:disabled{border-color:transparent;box-shadow:none}
.slot{border:var(--edge);background:var(--surface)}
.slot.hit{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.8) rotate(-3deg)}100%{transform:none}}
.entry input{border:var(--edge);box-shadow:inset 0 2px 0 var(--soft)}
.q h1{font-size:clamp(1.35rem,6vw,1.75rem)}
.board{gap:3px}
.cell.on{box-shadow:0 0 0 1.5px var(--ink);border-radius:5px}
.clue{border:var(--edge);box-shadow:var(--pop)}
.clue button{border:var(--edge)}
.toast{border:2px solid var(--surface)}
.over>div{border:3px solid var(--ink);border-bottom:0}
.over .st{color:var(--sun);-webkit-text-stroke:1.5px var(--ink)}
.seg{border:var(--edge)}
.seg button.on{background:var(--primary);color:var(--on-primary)}
.swatches button{background:var(--surface);border:var(--edge)}
.cal span.done{background:var(--sun);color:var(--sun-ink)}
.confeti{position:fixed;top:-20px;width:11px;height:16px;z-index:30;pointer-events:none;border-radius:2px;animation:caer linear forwards}
@keyframes caer{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confeti{display:none}}
</style>

async function cloudStart() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const doc = db.collection("data/users/" + id).doc("partida");
    const stored = await doc.get();
    /* Gana la copia más reciente: así un móvil nuevo recupera la partida. */
    const remote = stored.exists && stored.data().json ? JSON.parse(stored.data().json) : null;
    cloudDoc = doc;
    if (remote && (remote.t || 0) > (save.t || 0)) {
      save = Object.assign(save, remote);
      try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {}
      applyLook();
      if (document.querySelector(".logo")) home();
    } else {
      cloudPush();
    }
  } catch (e) {}
}

/* ---------- Sonidos ---------- */
let audio = null;
function tone(freq, start, dur, type, vol) {
  const osc = audio.createOscillator(), gain = audio.createGain(), t = audio.currentTime + start;
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain).connect(audio.destination);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}

function sfx(name) {
  if (!save.sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    TUNES[name].forEach(([f, at, d]) => tone(f, at, d, name === "wrong" ? "triangle" : "sine", name === "wrong" ? .12 : .2));

}

/* ---------- Reto del día y racha ---------- */
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const dayNum = key => { const [y, m, d] = key.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / 86400000); };
const keyOfNum = n => new Date(n * 86400000).toISOString().slice(0, 10);
const todayKey = () => dayKey(new Date());
function todayChallenge() {
  /* Mismo reto para todos cada día: un día encuesta y otro crucigrama. */
  const n = dayNum(todayKey()), mode = n % 2 === 0 ? "s" : "c", list = mode === "s" ? DATA.ds : DATA.dc;
  return {mode, level: list[Math.floor(n / 2) % list.length]};
}
const pardonFree = today => !save.r.pardon || today - dayNum(save.r.pardon) >= 7;
function streakNow() {
  if (!save.r.last) return 0;
  const today = dayNum(todayKey()), gap = today - dayNum(save.r.last);
  return gap <= 1 || (gap === 2 && pardonFree(today)) ? save.r.n : 0;
}
const dailyReward = n => Math.min(100, 20 + 10 * (n - 1)) + (n % 7 === 0 ? 200 : 0);
function startDaily() {
  const key = todayKey();
  if (save.r.days[key] === 1) return calendar();
  if (save.dayWip !== key) { delete save.w.s[DAY]; delete save.w.c[DAY]; save.dayWip = key; persist(); }
  (todayChallenge().mode === "s" ? playSurvey : playCross)(DAY);
}
function finishDaily(mode, stars_) {
  const key = todayKey(), today = dayNum(key), r = save.r;
  let reward = 0, usedPardon = false;
  delete save.w[mode][DAY];
  if (r.days[key] !== 1) {
    const gap = r.last ? today - dayNum(r.last) : null;
    if (gap === 1) r.n++;
    else if (gap === 2 && pardonFree(today)) {
      r.n++;
      r.pardon = keyOfNum(today - 1);
      r.days[r.pardon] = 2;
      usedPardon = true;
    } else r.n = 1;
    r.last = key;
    r.days[key] = 1;
    reward = dailyReward(r.n);
    save.coins += reward;
  }
  persist();
  refreshCoins();
  sfx("win");
  const box = sheet(`
    <h2>¡Reto superado!</h2>
    <p class="st" aria-label="${stars_} de 3 estrellas">${stars(stars_)}</p>
    <p>🔥 Racha de <b>${r.n} ${r.n === 1 ? "día" : "días"}</b>. Ganas ${reward} monedas.${r.n % 7 === 0 ? " ¡Premio especial de la semana incluido!" : ""}${usedPardon ? " Ayer se te pasó, pero has usado tu perdón semanal." : ""}</p>
    <div class="row">
      <button class="btn soft" id="w-cal">Calendario</button>
      <button class="btn" id="w-home">Inicio</button>
    </div>`);
  box.querySelector("#w-cal").onclick = () => { box.remove(); home(); calendar(); };
  box.querySelector("#w-home").onclick = () => { box.remove(); home(); };
}

  const days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();

function confetti() {
  const tones = [getComputedStyle(document.documentElement).getPropertyValue("--primary"), "#ffd23f", "#1f2933", "#ffffff"];
  for (let k = 0; k < 60; k++) {
    const bit = document.createElement("i");

function finish(mode, i, n, detail, firstTries, perfect) {
  confetti();
  if (i === DAY) return finishDaily(mode, n);
  const first = !save[mode][i];
  const base = first ? tierOf(i).reward * n : 0;
  const tries = first ? firstTries * FIRST_TRY : 0;
  const bonus = perfect && !save.p[mode][i] ? tierOf(i).reward * PERFECT_X : 0;
  const reward = base + tries + bonus;
  save[mode][i] = Math.max(save[mode][i] || 0, n);
  if (perfect) save.p[mode][i] = 1;
  delete save.w[mode][i];
  save.coins += reward;
  if (bonus) detail = `¡Nivel perfecto! +${bonus} monedas extra. ` + detail;
  if (tries) detail += ` ${firstTries} a la primera: +${tries}.`;

  box.classList.add("win");
  const go = fn => { box.remove(); fn(); };
  box.querySelector("#w-map").onclick = () => go(() => levelMap(mode));
  const b = box.querySelector("#w-next");
  if (b) b.onclick = () => go(() => play(mode, next));
}

/* ---------- Comparación de respuestas ---------- */
function clean(t) {
  return t.toLowerCase().trim().replace(/ñ/g, "\0").normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/\0/g, "ñ").replace(/[^a-z0-9ñ ]/g, "").replace(/\s+/g, " ").trim();
}
function forms(t) {
  const out = new Set([t]);
  const bare = t.replace(/^(el|la|los|las|un|una|unos|unas|mi|tu) /, "");
  [t, bare].forEach(x => {
    out.add(x);
    if (x.length > 3 && x.endsWith("s")) out.add(x.slice(0, -1));
    if (x.length > 4 && x.endsWith("es")) out.add(x.slice(0, -2));
  });
  return out;
}
function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({length: b.length + 1}, (_, k) => k);
  for (let i = 1; i <= a.length; i++) {
    const row = [i];
    for (let j = 1; j <= b.length; j++)
      row[j] = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = row;
  }
  return prev[b.length];
}
function matchAnswer(level, raw) {
  const f = forms(clean(raw));
  for (let i = 0; i < level.a.length; i++)
    for (const k of level.a[i].k)
      for (const v of forms(k)) if (f.has(v)) return i;
  const typed = clean(raw), near = new Set();
  level.a.forEach((a, i) => a.k.forEach(k => {
    const max = k.length >= 9 ? 2 : k.length >= 5 ? 1 : 0;
    if (max && lev(typed, k, max) <= max) near.add(i);
  }));
  return near.size === 1 ? [...near][0] : -1;
}

/* ---------- Modo encuesta ---------- */
const randomOf = list => list[Math.floor(Math.random() * list.length)];
function playSurvey(i) {
  const L = i === DAY ? todayChallenge().level : DATA.s[i], t = tierOf(i);
  const w = save.w.s[i] || {};
  const found = new Set(w.f || []);
  /* Posiciones de letra ya reveladas en cada respuesta; las partidas antiguas guardaban un contador. */
  const revealed = L.a.map((_, ix) => {
    const r = w.r && w.r[ix];
    return Array.isArray(r) ? r : Array.from({length: r || 0}, (_, k) => k);
  });
  let wrong = w.wrong || 0, hints = w.hints || 0, freeAt = w.freeAt || 6, firstTries = w.firstTries || 0, missed = !!w.missed;
  const store = () => {
    save.w.s[i] = {f: [...found], r: revealed, wrong, hints, freeAt, firstTries, missed};
    persist();
  };

  view(`
    <div class="top"><button class="back" id="b">←</button><div class="where">${i === DAY ? t.name : `Nivel ${i + 1} · ${t.name}`}<small>${esc(L.t)}</small></div>${coinsHtml()}</div>
    <div class="meter"><div class="bar"><i id="fill" style="width:0"></i></div><strong id="pct">0%</strong><button class="btn soft" id="h" type="button"></button></div>
    <div class="q">${L.i ? `<div class="pic" role="img" aria-label="Imagen de la pregunta">${L.i}</div>` : ""}<h1>${esc(L.q)}</h1></div>
    <form class="entry" id="f" autocomplete="off">
      <input id="g" type="text" placeholder="Escribe una respuesta" aria-label="Tu respuesta" autocapitalize="sentences" autocorrect="off" spellcheck="false" enterkeyhint="send">
      <button class="btn" type="submit">Probar</button>
    </form>
    <div class="scroll"><div class="slots" id="sl"></div></div>
  `);
  const input = pick("g");

  function mask(a, ix) {
    let n = 0;
    return [...a.t].map(c => {
      if (c === " ") return " ";
      return revealed[ix].includes(n++) ? c.toUpperCase() : "_";
    }).join(" ");
  }
  function draw() {
    pick("sl").innerHTML = L.a.map((a, ix) => {
      const hit = found.has(ix);
      return `<div class="slot ${hit ? "hit" : ""}"><span class="t">${esc(hit ? a.t : mask(a, ix))}</span><span class="p">${a.p}%</span></div>`;
    }).join("");
    const sum = [...found].reduce((x, ix) => x + L.a[ix].p, 0);
    pick("pct").textContent = sum + "%";
    pick("fill").style.width = sum + "%";
    pick("h").textContent = wrong >= freeAt ? "Pista gratis" : `Pista · ${HINT}`;
  }
  function checkDone() {
    if (found.size === L.a.length) {
      input.blur();
      const n = hints === 0 && wrong <= t.errs ? 3 : hints <= 2 && wrong <= t.errs * 3 ? 2 : 1;
      setTimeout(() => finish("s", i, n, `${L.a.length} respuestas, ${wrong} ${wrong === 1 ? "fallo" : "fallos"} y ${hints} ${hints === 1 ? "pista" : "pistas"}.`, firstTries, wrong === 0 && hints === 0), 500);
    }
  }
  function hit(ix) {
    found.add(ix);
    store();
    draw();
    checkDone();
  }
  pick("f").onsubmit = e => {
    e.preventDefault();
    const raw = input.value;
    if (!clean(raw)) return;
    input.value = "";
    input.focus();
    const ix = matchAnswer(L, raw);
    if (ix < 0 && (L.x || []).some(k => [...forms(k)].some(v => forms(clean(raw)).has(v)))) {
      say(`«${raw.trim()}» es buena idea, pero no está entre las 6`);
    } else if (ix < 0) {
      wrong++;
      missed = true;
      store();
      sfx("wrong");
      say(`«${raw.trim()}» no está en la lista`);
      input.classList.remove("shake"); void input.offsetWidth; input.classList.add("shake");
      draw();
    } else if (found.has(ix)) {
      say(`Ya tienes «${L.a[ix].t}»`);
    } else {
      sfx("hit");
      say(`¡Bien! +${L.a[ix].p}%`, 1200);
      if (!missed && !revealed[ix].length) firstTries++;
      missed = false;
      hit(ix);
    }
  };
  pick("h").onclick = () => {
    const free = wrong >= freeAt;
    if (!free && save.coins < HINT) return coinSheet();
    /* Letra al azar de una respuesta al azar de las que faltan. */
    const ix = randomOf(L.a.map((_, k) => k).filter(k => !found.has(k)));
    if (ix === undefined) return;
    if (free) freeAt = wrong + 6; else { save.coins -= HINT; refreshCoins(); }
    hints++;
    const letters = L.a[ix].t.replace(/ /g, "").length;
    const hidden = Array.from({length: letters}, (_, k) => k).filter(k => !revealed[ix].includes(k));
    revealed[ix].push(randomOf(hidden));
    if (revealed[ix].length >= letters) { sfx("hit"); say(`Era «${L.a[ix].t}»`); hit(ix); }
    else { store(); say("Letra nueva en una de las respuestas"); draw(); }
    input.focus();
  };
  pick("b").onclick = () => (i === DAY ? home() : levelMap("s"));
  draw();
  checkDone();
  input.focus();
}

/* ---------- Modo crucigrama ---------- */
const lettersOf = t => t.toUpperCase().replace(/Ñ/g, "\0").normalize("NFD").replace(/[̀-ͯ]/g, "")
  .replace(/\0/g, "Ñ").replace(/[^A-ZÑ]/g, "");
function playCross(i) {
  const L = i === DAY ? todayChallenge().level : DATA.c[i], t = tierOf(i);
  const cells = {}, key = (x, y) => x + "," + y;
  const entries = L.e.map(([word, clue, x, y, d]) => ({word, clue, x, y, d}))
    .sort((a, b) => a.y - b.y || a.x - b.x);
  const numbers = {};
  let num = 0;
  entries.forEach(e => {
    const k = key(e.x, e.y);
    if (!numbers[k]) numbers[k] = ++num;
    e.n = numbers[k];
    e.cells = [...e.word].map((ch, j) => {
      const c = e.d === 0 ? [e.x + j, e.y] : [e.x, e.y + j];
      const ck = key(c[0], c[1]);
      cells[ck] = cells[ck] || {x: c[0], y: c[1], sol: ch, val: "", locked: false, wrong: false};
      return ck;
    });
  });
  const w = save.w.c[i] || {};
  Object.entries(w.v || {}).forEach(([k, [val, locked, miss]]) => {
    if (cells[k]) Object.assign(cells[k], {val, locked: !!locked, miss: !!miss});
  });
  let cur = entries[0], pos = 0, hints = w.hints || 0, checks = w.checks || 0, done = false;
  const store = () => {
    const v = {};
    Object.entries(cells).forEach(([k, c]) => {
      if (c.val || c.miss) v[k] = [c.val, c.locked ? 1 : 0, c.miss ? 1 : 0];
    });
    save.w.c[i] = {v, hints, checks};
    persist();
  };

  view(`
    <div class="top"><button class="back" id="b">←</button><div class="where">${i === DAY ? t.name : `Nivel ${i + 1} · ${t.name}`}<small>${esc(L.t)}</small></div>${coinsHtml()}</div>
    <div class="boardbox" id="bx"><input class="ghost" id="ci" type="text" aria-label="Escribe la letra" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="next"><div class="board" id="bd" style="grid-template-columns:repeat(${L.w},var(--c))"></div></div>
    <div class="tools">
      <button class="btn soft" id="all">Ver pistas</button>
      <button class="btn soft" id="hl">Letra · ${HINT}</button>
      <button class="btn soft" id="ck">Revisar</button>
    </div>
    <div class="clue"><button id="prev" aria-label="Pista anterior">‹</button><span id="cl"></span><button id="nextc" aria-label="Pista siguiente">›</button></div>
  `);
  const board = pick("bd"), holder = pick("bx");
  for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) {
    const k = key(x, y), el = document.createElement("div");
    el.className = "cell";
    if (cells[k]) {
      el.classList.add("on");
      el.dataset.k = k;
      cells[k].el = el;
      el.innerHTML = (numbers[k] ? `<span class="n">${numbers[k]}</span>` : "") + `<span class="l"></span>`;
    }
    board.appendChild(el);
  }
  function fit() {
    const gap = 3;
    const size = Math.min((holder.clientWidth - gap * (L.w - 1)) / L.w, (holder.clientHeight - gap * (L.h - 1)) / L.h, 56);
    board.style.setProperty("--c", Math.max(14, Math.floor(size)) + "px");
  }
  const watcher = new ResizeObserver(fit);
  watcher.observe(holder);
  fit();

  const solved = e => e.cells.every(k => cells[k].val === cells[k].sol);
  const filled = () => Object.values(cells).every(c => c.val);
  const allOk = () => Object.values(cells).every(c => c.val === c.sol);

  function draw() {
    Object.entries(cells).forEach(([k, c]) => {
      const inWord = cur.cells.includes(k), isCur = cur.cells[pos] === k;
      c.el.className = "cell on" + (isCur ? " cur" : inWord ? " word" : "") + (c.locked ? " solved" : "") + (c.wrong ? " wrong" : "");
      c.el.querySelector(".l").textContent = c.val;
    });
    pick("cl").innerHTML = `<span><b>${cur.n} ${cur.d === 0 ? "→" : "↓"}</b> ${esc(cur.clue)} (${cur.word.length})</span>`;
  }
  function select(e, p) {
    cur = e;
    pos = p !== undefined ? p : Math.max(0, e.cells.findIndex(k => !cells[k].val));
    draw();
  }
  function markSolved(quiet) {
    entries.forEach(e => {
      if (e.ok || !solved(e)) return;
      e.ok = true;
      e.cells.forEach(k => { cells[k].locked = true; });
      if (!quiet) sfx("word");
    });
  }
  function afterChange() {
    markSolved();
    if (filled()) {
      if (allOk()) {
        if (done) return;
        done = true;
        draw();
        const n = hints === 0 ? 3 : hints <= 2 ? 2 : 1;
        const firstTries = entries.filter(e => e.cells.every(k => !cells[k].miss)).length;
        const perfect = hints === 0 && checks === 0 && firstTries === entries.length;
        setTimeout(() => finish("c", i, n, `${entries.length} palabras con ${hints} ${hints === 1 ? "ayuda" : "ayudas"}.`, firstTries, perfect), 450);
        return;
      }
      sfx("wrong");
      say("Tablero lleno, pero alguna letra está mal. Pulsa Revisar.", 3000);
    }
  }
  function advance() {
    let p = pos + 1;
    while (p < cur.cells.length && cells[cur.cells[p]].locked) p++;
    if (p < cur.cells.length) { pos = p; return; }
    const ix = entries.indexOf(cur);
    for (let s = 1; s <= entries.length; s++) {
      const e = entries[(ix + s) % entries.length];
      if (e.cells.some(k => !cells[k].val)) { select(e); return; }
    }
  }
  function type(ch) {
    if (done) return;
    /* Las casillas ya resueltas no se tocan: la letra va a la siguiente libre. */
    while (cells[cur.cells[pos]].locked && pos < cur.cells.length - 1) pos++;
    const c = cells[cur.cells[pos]];
    if (!c.locked) { c.val = ch; c.wrong = false; if (ch !== c.sol) c.miss = true; }
    advance();
    store();
    afterChange();
    draw();
  }
  function erase() {
    if (done) return;
    const c = cells[cur.cells[pos]];
    if (c.val && !c.locked) { c.val = ""; c.wrong = false; }
    else if (pos > 0) {
      pos--;
      const p = cells[cur.cells[pos]];
      if (!p.locked) { p.val = ""; p.wrong = false; }
    }
    store();
    draw();
  }
  function moveClue(step) {
    const ix = entries.indexOf(cur);
    select(entries[(ix + step + entries.length) % entries.length]);
  }
  function arrow(dx, dy) {
    const c = cells[cur.cells[pos]], wantD = dx ? 0 : 1;
    if (cur.d !== wantD) {
      const k = key(c.x, c.y), other = entries.find(e => e.d === wantD && e.cells.includes(k));
      if (other) { select(other, other.cells.indexOf(k)); return; }
    }
    let nx = c.x + dx, ny = c.y + dy;
    while (nx >= 0 && ny >= 0 && nx < L.w && ny < L.h) {
      const k = key(nx, ny);
      if (cells[k]) {
        const e = cur.cells.includes(k) ? cur : entries.find(en => en.cells.includes(k) && en.d === wantD) || entries.find(en => en.cells.includes(k));
        select(e, e.cells.indexOf(k));
        return;
      }
      nx += dx; ny += dy;
    }
  }
  /* Elige la casilla al poner el dedo, antes de que el teclado mueva el tablero; si el toque cae
     en un hueco, vale la casilla más cercana. */
  function cellAt(ev) {
    const direct = ev.target.closest && ev.target.closest(".cell.on");
    if (direct) return direct;
    let best = null, bestD = Infinity;
    board.querySelectorAll(".cell.on").forEach(el => {
      const r = el.getBoundingClientRect();
      const d = Math.hypot(ev.clientX - (r.left + r.width / 2), ev.clientY - (r.top + r.height / 2));
      if (d < bestD) { best = el; bestD = d; }
    });
    return best && bestD < best.offsetWidth * 1.2 ? best : null;
  }
  holder.addEventListener("pointerdown", ev => {
    const el = cellAt(ev);
    if (!el) return;
    const k = el.dataset.k, here = entries.filter(e => e.cells.includes(k));
    let e = here.find(x => x === cur);
    if (e && cur.cells[pos] === k && here.length > 1) e = here.find(x => x !== cur);
    e = e || here[0];
    select(e, e.cells.indexOf(k));
  });
  holder.addEventListener("click", () => focusKeys());
  /* Un campo invisible abre el teclado del móvil. Guarda siempre un espacio: si desaparece, se ha pulsado borrar. */
  const ghost = pick("ci");
  function focusKeys() {
    ghost.value = " ";
    ghost.focus({preventScroll: true});
    ghost.setSelectionRange(1, 1);
  }
  /* Una tecla, una letra: los teclados de Android van acumulando el texto mientras se escribe. */
  ghost.addEventListener("input", ev => {
    const erased = (ev.inputType || "").startsWith("delete") || !ghost.value;
    const letters = lettersOf(ev.data || ghost.value);
    if (erased) erase();
    else if (letters) type(letters[letters.length - 1]);
    ghost.value = " ";
    ghost.setSelectionRange(1, 1);
  });
  const onKey = ev => {
    if (document.querySelector(".over") || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    const moves = {ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1]};
    if (moves[ev.key]) arrow(...moves[ev.key]);
    else if (ev.key === "Tab" || ev.key === "Enter") moveClue(ev.shiftKey ? -1 : 1);
    else if (document.activeElement !== ghost && /^[a-zA-ZñÑ]$/.test(ev.key)) { type(ev.key.toUpperCase()); focusKeys(); }
    else return;
    ev.preventDefault();
  };
  document.addEventListener("keydown", onKey);
  teardown = () => { document.removeEventListener("keydown", onKey); watcher.disconnect(); };
  pick("cl").onclick = focusKeys;

  pick("prev").onclick = () => { moveClue(-1); focusKeys(); };
  pick("nextc").onclick = () => { moveClue(1); focusKeys(); };
  pick("b").onclick = () => (i === DAY ? home() : levelMap("c"));
  pick("all").onclick = () => {
    const group = d => entries.filter(e => e.d === d).map(e =>
      `<li><button data-e="${entries.indexOf(e)}" class="${e === cur ? "sel" : ""} ${solved(e) ? "ok" : ""}"><b>${e.n}</b><span>${esc(e.clue)} (${e.word.length})</span></button></li>`).join("");
    const box = sheet(`<h3>Horizontales →</h3><ol class="cluelist">${group(0)}</ol><h3>Verticales ↓</h3><ol class="cluelist">${group(1)}</ol><button class="btn" id="ok">Cerrar</button>`);
    box.querySelector("#ok").onclick = () => { box.remove(); focusKeys(); };
    box.querySelectorAll("[data-e]").forEach(b => b.onclick = () => { box.remove(); select(entries[+b.dataset.e]); focusKeys(); });
  };
  pick("hl").onclick = () => {
    if (done) return;
    if (save.coins < HINT) return coinSheet();
    /* Letra al azar de la palabra actual; si ya está bien, de cualquier otra. */
    const missing = list => list.filter(x => cells[x].val !== cells[x].sol);
    const k = randomOf(missing(cur.cells).length ? missing(cur.cells) : missing(Object.keys(cells)));
    if (!k) return;
    save.coins -= HINT; refreshCoins();
    hints++;
    cells[k].val = cells[k].sol; cells[k].locked = true; cells[k].wrong = false; cells[k].miss = true;
    store();
    afterChange();
    draw();
    focusKeys();
  };
  pick("ck").onclick = () => {
    if (done) return;
    let bad = 0;
    Object.values(cells).forEach(c => { c.wrong = !!c.val && c.val !== c.sol; if (c.wrong) bad++; });
    checks++;
    store();
    if (bad) sfx("wrong");
    say(bad ? `${bad} ${bad === 1 ? "letra está mal" : "letras están mal"}` : "Todo lo escrito está bien");
    draw();
    focusKeys();
  };
  markSolved(true);
  afterChange();
  focusKeys();
  select(entries.find(e => e.cells.some(k => !cells[k].val)) || entries[0]);
}

applyLook();
home();
cloudStart();
/* Pide al navegador que no borre la partida cuando falte espacio. */
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
